{% extends 'base.html' %}

{% block title %}Add Spare Part - EV Stock Manager{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <div class="header" style="border-bottom: 1px solid #334155; padding-bottom: 1rem; margin-bottom: 1.5rem;">
        <h1 style="margin: 0; font-size: 1.5rem; color: #fbbf24; display: flex; align-items: center; gap: 0.5rem;">
            <span>⚙️</span> Add Spare Part / Accessory
        </h1>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin: 0.25rem 0 0;">
            Track inventory stock counts, cost price, and retail selling price.
        </p>
    </div>

    <form method="post" action="{% url 'add_spare_part' %}">
        {% csrf_token %}
        <div class="grid" style="grid-template-columns: 1.5fr 1fr; gap: 1rem; margin-bottom: 1.25rem;">
            <div>
                <label style="display: block; margin-bottom: 0.4rem; color: var(--text-muted); font-size: 0.85rem;">Part Name / Description *</label>
                <input type="text" name="name" required placeholder="e.g. Front Disc Brake Pad Set" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white;">
            </div>
            <div>
                <label style="display: block; margin-bottom: 0.4rem; color: var(--text-muted); font-size: 0.85rem;">Part Number / SKU *</label>
                <input type="text" name="part_number" required placeholder="e.g. SP-BRK-01" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-family: monospace;">
            </div>
        </div>

        <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem;">
            <div>
                <label style="display: block; margin-bottom: 0.4rem; color: var(--text-muted); font-size: 0.85rem;">Category</label>
                <input type="text" name="category" value="General Spare" placeholder="e.g. Braking, Electrical, Body" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white;">
            </div>
            <div>
                <label style="display: block; margin-bottom: 0.4rem; color: var(--text-muted); font-size: 0.85rem;">In-Stock Quantity *</label>
                <input type="number" min="0" name="quantity" value="10" required style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white;">
            </div>
        </div>

        <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem;">
            <div>
                <label style="display: block; margin-bottom: 0.4rem; color: var(--text-muted); font-size: 0.85rem;">Unit Cost Price (₹)</label>
                <input type="number" step="0.01" name="cost_price" placeholder="220.00" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white;">
            </div>
            <div>
                <label style="display: block; margin-bottom: 0.4rem; color: var(--text-muted); font-size: 0.85rem;">Selling Price (₹) *</label>
                <input type="number" step="0.01" name="selling_price" required placeholder="499.00" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fbbf24; font-weight: 600;">
            </div>
        </div>

        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; margin-bottom: 0.4rem; color: var(--text-muted); font-size: 0.85rem;">Supplier Details</label>
            <textarea name="supplier_details" rows="2" placeholder="Supplier name, invoice reference..." style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white;"></textarea>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 1rem;">
            <a href="{% url 'inventory_list' %}?tab=spares" class="btn" style="background: transparent; border: 1px solid #64748b; color: #94a3b8;">Cancel</a>
            <button type="submit" class="btn" style="background: #d97706;">Add Spare Part</button>
        </div>
    </form>
</div>
{% endblock %}
